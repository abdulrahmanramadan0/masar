<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسار</title>
<meta name="author" content="Abdulrahman Ramadan">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bgi:linear-gradient(165deg,#e8efdd 0%,#f1f0e6 50%,#e2ebd7 100%);--bg:#f1f3ea;--card:#f9faf5;--ink:#16211a;--mut:#5f6f63;--g:#3f8f1f;--on:#fff;--ln:#d6dfca;--gl:#eef5e8;--r:#c43d2f;--tb:#f6f8f0;--tt:#16211a;--hb:#e9f0df;--ht:#16211a;--hn:#2f7415;--rad:12px;--sh:0 1px 2px #0f3d2e14;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bgi:linear-gradient(165deg,#0b160e 0%,#0f1912 55%,#112119 100%);--bg:#0f1912;--card:#172419;--ink:#e8f0e3;--mut:#9db09f;--g:#6fbf3a;--on:#0b2013;--ln:#2a3e2c;--gl:#223a20;--r:#c43d2f;--tb:#0b2013;--tt:#fff;--hb:#143822;--ht:#fff;--hn:#f2b705;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg) var(--bgi) fixed;color:var(--ink);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--tb);color:var(--tt);border-bottom:1px solid var(--ln);padding:10px 16px;display:flex;align-items:center;gap:12px}
.top img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid var(--ln)}
.top b{font-size:21px;font-weight:700;color:var(--g)}.top small{display:block;opacity:.8;font-size:12px;line-height:1.4;max-width:46ch}
.top .btn{margin-inline-start:auto;background:transparent;color:var(--tt);border:1px solid var(--ln)}.top .btn+.btn{margin-inline-start:0}
main{max-width:1120px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:17px;font-weight:600}
.btn{background:var(--g);color:var(--on);border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600}
.btn.s{background:transparent;color:var(--g);border:1px solid var(--g)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible,summary:focus-visible{outline:3px solid var(--g);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.auth{max-width:440px;margin:28px auto}.auth h1{margin:0 0 4px;font-size:36px;font-weight:700;color:var(--g)}.auth h2{margin:6px 0;text-align:center}
.sw{display:flex;gap:6px;margin:12px 0}.sw button{flex:1;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:6px;cursor:pointer}.sw button.on{border-color:var(--g);color:var(--g);font-weight:700}
.chk svg{width:84px;display:block;margin:6px auto}.chk circle,.chk path{fill:none;stroke:var(--g);stroke-linecap:round;stroke-linejoin:round}.chk circle{stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:d .7s forwards}.chk path{stroke-width:4;stroke-dasharray:44;stroke-dashoffset:44;animation:d .5s .6s forwards}@keyframes d{to{stroke-dashoffset:0}}
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);gap:20px;align-items:start}
.nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--ln);border-radius:var(--rad);padding:8px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:9px;padding:9px 10px;cursor:pointer;text-align:start;color:var(--mut)}
.nav button.on{background:var(--gl);color:var(--g);font-weight:700}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mini{border-top:1px solid var(--ln);margin-top:8px;padding:10px 10px 4px;font-size:12px;color:var(--mut)}.mini b{display:block;font-size:24px;color:var(--g);line-height:1.2}
.tabs{display:flex;justify-content:center;gap:6px;margin:14px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:6px 16px;cursor:pointer}.tabs button.on{background:var(--g);color:var(--on);border-color:var(--g)}
.lead{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--hb);color:var(--ht);border:1px solid var(--ln);border-radius:var(--rad);padding:22px;margin-bottom:14px}
.lead .n{font-size:68px;font-weight:700;line-height:1;color:var(--hn)}.lead small{display:block;opacity:.8;font-size:13px}
.lead .st{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}.lead .st b{display:block;font-size:22px;color:var(--hn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.pg{height:10px;border-radius:9px;background:var(--gl);overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--g)}
.dist div{display:grid;grid-template-columns:84px 1fr 28px;gap:8px;align-items:center;font-size:13px}.dist .pg{margin:3px 0}
.go{display:flex;gap:10px;flex-wrap:wrap}
.emp{text-align:center;padding:26px 10px}
.ch{width:100%;height:auto;display:block}.ch text{fill:var(--mut);font-size:12px;font-family:inherit}.ch .l{stroke:var(--g);stroke-width:2.5;fill:none}.ch .d{fill:var(--g)}.ch .gr{stroke:var(--ln)}
dialog{border:1px solid var(--ln);border-radius:var(--rad);background:var(--card);color:var(--ink);max-width:min(560px,94vw);padding:18px}dialog::backdrop{background:#0008}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;text-align:start;border-bottom:1px solid var(--ln)}th{color:var(--mut);font-weight:600;font-size:12px}
td input{width:76px;padding:4px 8px}td input.nm{width:100%;min-width:170px}td input.hh{width:60px}.sem{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px;font-weight:700}.sem span{font-weight:400;color:var(--mut);font-size:13px}
.x{background:none;border:0;color:var(--r);cursor:pointer;font-size:20px;padding:0 6px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
.res{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--gl);font-weight:600}.bad{color:var(--r)}.mut{color:var(--mut);font-size:13px}
.rep{background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:24px}.rep h3{text-align:center;margin:0}.rep .mut{color:#555}.rep th{color:#444}.rep td,.rep th{border-color:#ddd}
#fm{display:block;margin-top:6px}.tot{display:flex;flex-wrap:wrap;gap:18px;margin-top:12px;font-weight:700}
@media(max-width:820px){.shell{display:block}.nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:5;flex-direction:row;overflow-x:auto;border-radius:0;border-width:1px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}.nav button{flex:0 0 auto;flex-direction:column;gap:2px;font-size:11px;padding:6px 10px}.mini{display:none}main{padding-bottom:20px}.ft{padding-bottom:96px}.lead{grid-template-columns:1fr;text-align:center}.top small{display:none}}
@media(max-width:820px){table:has(tr[data-i]),table:has(tr[data-i]) tbody{display:block}table:has(tr[data-i]) tr:not([data-i]){display:none}
tr[data-i]{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 8px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:end;position:relative}
tr[data-i] td{border:0;padding:0;min-width:0}tr[data-i] td input,td input.nm,td input.hh{width:100%;min-width:0}
tr[data-i] td:first-child{grid-column:1/-1;margin-inline-end:40px}
tr[data-i] td:last-child{position:absolute;inset-block-start:26px;inset-inline-end:0}
tr[data-i] td::before{display:block;font-size:11px;color:var(--mut)}tr[data-i] td:last-child::before{content:none}
tr[data-i] td:first-child::before{content:'المادة'}td:has(.hh)::before{content:'ساعات'}td:has(.gi)::before{content:'العلامة'}td:has(.tt)::before{content:'نظري'}td:has(.pp)::before{content:'عملي'}td.tg::before{content:'المجموع'}td.lt::before{content:'التقدير'}td.pt::before{content:'النقاط'}
.x{padding:6px 10px}.rep{overflow-x:auto}.card{min-width:0}}
html,body{overflow-x:hidden}
.btn{transition:transform .12s,filter .2s}.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.07)}.nav button{transition:background .25s,color .25s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes gw{from{transform:scaleX(0)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{from{opacity:0}}
#body>*{animation:up .5s both}#body>:nth-child(2){animation-delay:.07s}#body>:nth-child(3){animation-delay:.14s}#body>:nth-child(4){animation-delay:.21s}#body>:nth-child(n+5){animation-delay:.28s}
.auth{animation:up .5s both}dialog[open]{animation:up .25s both}
.pg i{transform-origin:right center;animation:gw .9s .25s both}
.ch .l{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s .35s forwards}.ch .d{animation:fi .4s 1s both}
.gauge{position:relative;width:250px;margin:auto;text-align:center}.gauge svg{width:100%;display:block}.gauge path{fill:none;stroke-width:14;stroke-linecap:round}.gb{stroke:var(--ln)}.gf{stroke:var(--hn);stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.gauge .n{position:absolute;inset:auto 0 26px;font-size:46px;line-height:1}.gauge small{position:absolute;inset:auto 0 2px}
.top .btn.ic{position:relative;padding:9px 11px;line-height:0}.top .ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:-6px;inset-inline-end:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--r);color:#fff;font-size:11px;font-weight:700;line-height:19px;padding:0 4px;animation:up .4s both}
.nt{border-bottom:1px solid var(--ln);padding:12px 0}.nt h4{margin:0 0 2px}.nt time{font-size:12px;color:var(--mut)}.nt p{margin:6px 0;white-space:pre-wrap}.nt img{max-width:100%;border-radius:10px;display:block;margin-top:8px}.nl{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--ln);padding:8px 0}
.ft{text-align:center;padding:6px 12px 18px}
.stu summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-weight:600}.sg{color:var(--g);font-weight:700}
.si{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.si small{display:block;color:var(--mut);font-size:12px}.si b{overflow-wrap:anywhere;font-weight:600}.si>:last-child{grid-column:1/-1}
details.card th,details.card td{padding:6px 4px;font-size:13px}details.card td:first-child,details.card th:first-child{width:46%}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}.chk circle,.chk path,.ch .l{stroke-dashoffset:0}}
@media print{.np{display:none!important}body{background:#fff}main{padding:0}.shell{display:block}.rep{border:0}}
</style></head><body>
